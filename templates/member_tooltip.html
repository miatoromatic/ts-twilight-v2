<xf:css src="member_tooltip.less" />

<!--
	==========================================================
	Terrasphere — member tooltip (mini profile card)
	==========================================================
-->

<!-- Respects the member's "show online status" privacy setting -->
<xf:set var="$tsCanSeeStatus" value="{{ $user.canViewOnlineStatus() }}" />
<xf:set var="$tsOnline" value="{{ $tsCanSeeStatus && $user.isOnline() }}" />

<div class="tooltip-content-inner">
	<div class="memberTooltip tsTip {{ $user.Profile.banner_date ? 'memberTooltip--withBanner' : '' }}">
		<xf:profilebanner user="$user" size="m" class="memberTooltip-header tsTip-header" toggle="memberTooltip--withBanner">
			<div class="tsTip-veil" aria-hidden="true"></div>

			<div class="tsTip-headerInner">

				<!-- ===== Top bar: status / location | tools ===== -->
				<div class="tsTip-topbar">
					<xf:if contentcheck="true">
						<div class="tsTip-status">
							<xf:contentcheck>
								<xf:if is="$tsOnline">
									<span class="tsTip-statusState tsTip-statusState--online"><span class="tsTip-statusDot" aria-hidden="true"></span>Online</span>
								<xf:elseif is="$tsCanSeeStatus" />
									<span class="tsTip-statusState tsTip-statusState--offline"><span class="tsTip-statusDot" aria-hidden="true"></span>Offline</span>
								</xf:if>
								<xf:if is="$user.Profile.location">
									<span class="tsTip-statusSep" aria-hidden="true"></span>
									<span class="tsTip-location"><xf:fa icon="fa-map-marker-alt" /> {$user.Profile.location}</span>
								</xf:if>
							</xf:contentcheck>
						</div>
					</xf:if>

					<div class="tsTip-tools memberTooltip-headerAction">
						<a href="{{ link('members', $user) }}" class="tsTip-tool"
							data-xf-init="tooltip" title="View profile" aria-label="View profile"><xf:fa icon="fa-eye" /></a>

						<!--[XF:header_action_start]-->
						<xf:if contentcheck="true">
							<xf:button class="button--link button--small menuTrigger tsTip-tool"
								data-xf-click="menu"
								aria-label="{{ phrase('more_options') }}"
								aria-expanded="false"
								aria-haspopup="true">
								<xf:fa icon="fa-cog" />
							</xf:button>

							<div class="menu" data-menu="menu" aria-hidden="true">
								<div class="menu-content">
									<h3 class="menu-header">{{ phrase('moderator_tools') }}</h3>
									<xf:contentcheck>
										<!-- Character thread link (moved here from the card).
											 Same conditions as before: character elements + terrasphere_cm_review.
											 Written as a real xf:if now; the old HTML-comment-wrapped xf:if was
											 already active, so who sees it does not change. -->
										<xf:if is="$user.canShowCharacterElements() && $xf.visitor.hasPermission('terrasphere', 'terrasphere_cm_review')">
											<div class="tsTip-menuThread">
												<xf:macro template="terrasphere_core_generic_macros"
													name="character_sheet_thread_link"
													arg-user="{$user}" />
											</div>
										</xf:if>
										<xf:macro template="member_macros" name="moderator_menu_actions"
											arg-user="{$user}"
											arg-context="tooltip" />
									</xf:contentcheck>
								</div>
							</div>
						</xf:if>
						<!--[XF:header_action_end]-->
					</div>
				</div>

				<!-- ===== Identity: avatar | name, banners, title, custom fields ===== -->
				<div class="tsTip-identity">
					<div class="tsTip-avatarCol memberTooltip-avatar">
						<xf:avatar user="{$user}" size="m" notooltip="true" />
					</div>

					<div class="tsTip-idInfo memberTooltip-headerInfo">
						<div class="tsTip-nameRow">
							<h4 class="memberTooltip-name tsTip-name">
								<span class="memberTooltip-nameWrapper">
									<xf:username user="$user" rich="true" notooltip="true" />
								</span>
							</h4>
							<xf:if contentcheck="true">
								<span class="tsTip-banners memberTooltip-banners">
									<xf:contentcheck><xf:userbanners user="$user" /></xf:contentcheck>
								</span>
							</xf:if>
						</div>

						<xf:if contentcheck="true">
							<div class="tsTip-title">
								<xf:contentcheck><xf:usertitle user="$user" /></xf:contentcheck>
							</div>
						</xf:if>

						<!-- Custom user fields: same set as in posts ("Display in messages"). See README to change. -->
						<xf:macro template="custom_fields_macros" name="custom_fields_view"
							arg-type="users"
							arg-group="personal"
							arg-set="{$user.Profile.custom_fields}"
							arg-additionalFilters="{{ ['message'] }}"
							arg-wrapperClass="tsTip-fields"
							arg-valueClass="pairs pairs--columns tsTip-field" />
					</div>
				</div>

				<!-- ===== Facts: joined | last active, then current activity ===== -->
				<div class="tsTip-facts memberTooltip-blurbContainer">
					<div class="tsTip-factRow">
						<span class="tsTip-joined">
							<xf:fa icon="fa-calendar-check" />
							{{ phrase('joined') }}: <b><xf:date time="$user.register_date" /></b>
						</span>
						<xf:if is="$tsCanSeeStatus && $user.last_activity">
							<span class="tsTip-ago" title="{{ phrase('last_seen')|for_attr }}">
								<xf:fa icon="fa-clock" />
								<xf:date time="$user.last_activity" />
							</span>
						</xf:if>
					</div>

					<!-- useractivity outputs "<time> · Viewing thread <title>"; the leading time is hidden in CSS -->
					<xf:if contentcheck="true">
						<div class="tsTip-activity">
							<xf:contentcheck><xf:useractivity user="$user" /></xf:contentcheck>
						</div>
					</xf:if>
				</div>

			</div>
		</xf:profilebanner>

		<!-- ===== Stats strip: Messages / Fame / Gold / Mastery / Valor ===== -->
		<div class="memberTooltip-info tsTip-stats">
			<div class="memberTooltip-stats">
				<div class="pairJustifier">
					<xf:macro template="member_macros" name="member_stat_pairs"
						arg-user="{$user}"
						arg-context="tooltip" />
				</div>
			</div>
		</div>

		<!-- ===== Actions: Follow / Character sheet / PM — one row, buttons share the width ===== -->
		<xf:if contentcheck="true">
			<div class="memberTooltip-actions tsTip-actions">
				<xf:contentcheck>
					<xf:if is="$xf.visitor.canFollowUser($user)">
						<xf:button href="{{ link('members/follow', $user) }}"
							class="button--link tsTip-btn tsTip-btn--follow"
							data-xf-click="switch"
							data-sk-follow="{{ phrase('follow')|for_attr }}"
							data-sk-unfollow="{{ phrase('unfollow')|for_attr }}">
							{{ $xf.visitor.isFollowing($user) ? phrase('unfollow') : phrase('follow') }}
						</xf:button>
					</xf:if>

					<xf:if is="$user.canShowCharacterElements()">
						<span class="tsTip-act tsTip-act--sheet">
							<xf:macro template="terrasphere_core_generic_macros"
								name="character_sheet_modal_button"
								arg-user="{$user}" />
						</span>
					</xf:if>

					<xf:if is="$xf.visitor.canStartConversationWith($user)">
						<a href="{{ link('conversations/add', null, {'to': $user.username}) }}"
							class="button tsTip-btn tsTip-btn--primary">
							<xf:fa icon="fa-paper-plane" />
							<span class="button-text">PM</span>
						</a>
					</xf:if>
				</xf:contentcheck>
			</div>
		</xf:if>
	</div>
</div>
